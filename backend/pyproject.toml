# ProcuraShield Backend — Ruff конфигурация (линтер + форматтер Python)

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # длина строки (обрабатывается formatter)
    "S101",  # assert в тестах допустим
    "S105",  # hardcoded passwords в конфигах допустимы
    "B008",  # Depends() в FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"backend/app/core/config.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
